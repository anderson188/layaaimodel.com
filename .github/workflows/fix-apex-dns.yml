name: Fix apex DNS and www redirect

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure apex CNAME + 301 to www
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: 6b9d7aa4c8c5121d0650a4bea977bf9b
          CF_ZONE: 73a3f9ef9b9347963cb03ccc65bf84aa
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${CF_TOKEN}"

          echo "== Token capability probe =="
          DNS_PROBE=$(curl -sS -H "$AUTH" \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/dns_records?per_page=1")
          echo "$DNS_PROBE" | head -c 500
          echo
          if echo "$DNS_PROBE" | grep -q '"code":10000'; then
            echo "::error::CLOUDFLARE_API_TOKEN cannot read/write DNS (error 10000)."
            echo "::error::Create a token with Zone.DNS Edit + Account.Account Rulesets Edit for layaaimodel.com, update the GitHub secret, then re-run."
            echo "::error::Manual fallback: DNS CNAME @ → layaaimodel.pages.dev (proxied), then Bulk Redirect or Pages _redirects apex→www."
            exit 1
          fi

          echo "== DNS list (apex/www) =="
          curl -sS -H "$AUTH" \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/dns_records?per_page=100" \
            | tee /tmp/dns.json | head -c 2000
          echo

          APEX_ID=$(python3 - <<'PY'
          import json
          data=json.load(open("/tmp/dns.json"))
          for r in data.get("result") or []:
            if r.get("name")=="layaaimodel.com" and r.get("type") in ("CNAME","A","AAAA"):
              print(r["id"]); break
          PY
          )

          if [ -n "${APEX_ID}" ]; then
            echo "Updating existing apex record ${APEX_ID}"
            curl -sS -X PUT -H "$AUTH" -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/dns_records/${APEX_ID}" \
              --data '{"type":"CNAME","name":"@","content":"layaaimodel.pages.dev","proxied":true,"ttl":1}'
          else
            echo "Creating apex CNAME"
            curl -sS -X POST -H "$AUTH" -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/dns_records" \
              --data '{"type":"CNAME","name":"@","content":"layaaimodel.pages.dev","proxied":true,"ttl":1}'
          fi
          echo

          echo "== Ensure Pages apex domain =="
          curl -sS -H "$AUTH" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/layaaimodel/domains" \
            | tee /tmp/domains.json
          echo
          HAS_APEX=$(python3 - <<'PY'
          import json
          data=json.load(open("/tmp/domains.json"))
          print("1" if any(d.get("name")=="layaaimodel.com" for d in (data.get("result") or [])) else "0")
          PY
          )
          if [ "$HAS_APEX" = "0" ]; then
            curl -sS -X POST -H "$AUTH" -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/layaaimodel/domains" \
              --data '{"name":"layaaimodel.com"}'
            echo
          fi

          echo "== Single Redirect rule (apex host → www) =="
          # Prefer dynamic redirect in http_request_dynamic_redirect (no Bulk List ACL needed)
          curl -sS -H "$AUTH" \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/rulesets/phases/http_request_dynamic_redirect/entrypoint" \
            | tee /tmp/dyn.json
          echo
          RULESET_ID=$(python3 - <<'PY'
          import json
          data=json.load(open("/tmp/dyn.json"))
          print((data.get("result") or {}).get("id",""))
          PY
          )
          RULE_BODY='{"description":"Apex to www 301","expression":"(http.host eq \"layaaimodel.com\")","action":"redirect","action_parameters":{"from_value":{"target_url":{"expression":"concat(\"https://www.layaaimodel.com\", http.request.uri.path)"},"status_code":301,"preserve_query_string":true}}}'
          if [ -z "$RULESET_ID" ]; then
            curl -sS -X PUT -H "$AUTH" -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/rulesets/phases/http_request_dynamic_redirect/entrypoint" \
              --data "{\"rules\":[${RULE_BODY}]}"
          else
            python3 - <<'PY'
          import json
          data=json.load(open("/tmp/dyn.json"))
          rules=data.get("result",{}).get("rules") or []
          exists=any("layaaimodel.com" in (r.get("expression") or "") for r in rules)
          open("/tmp/has_rule","w").write("1" if exists else "0")
          PY
            if [ "$(cat /tmp/has_rule)" = "0" ]; then
              curl -sS -X POST -H "$AUTH" -H "Content-Type: application/json" \
                "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/rulesets/${RULESET_ID}/rules" \
                --data "$RULE_BODY"
              echo
            else
              echo "Dynamic redirect rule already present"
            fi
          fi

          echo "DONE — verify: curl -sI https://layaaimodel.com/ | head"
